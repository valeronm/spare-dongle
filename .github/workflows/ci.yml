name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # rustup's homes default to ~/.rustup and ~/.cargo, outside the mise data directory that
      # mise-action caches.
      MISE_RUSTUP_HOME: /home/runner/.local/share/mise/rustup
      MISE_CARGO_HOME: /home/runner/.local/share/mise/cargo
      # Only the app job builds the Android app.
      MISE_DISABLE_TOOLS: cargo:cargo-ndk,java
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          cache_key_prefix: mise-rustup-v1
      - uses: Swatinem/rust-cache@v2
      - run: mise run lint
      - run: mise run test

  app:
    runs-on: ubuntu-latest
    env:
      MISE_RUSTUP_HOME: /home/runner/.local/share/mise/rustup
      MISE_CARGO_HOME: /home/runner/.local/share/mise/cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ndk
        run: sed -n 's/^ *ndkVersion = "\(.*\)"$/version=\1/p' android/app/build.gradle.kts >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools ndk;${{ steps.ndk.outputs.version }}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache_key_prefix: mise-app-v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run app

  tool-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # mise.toml's other tools build and test the firmware, which only the Linux job does.
      - run: |
          rust=$(tools/rust-version.sh)
          rustup toolchain install "$rust" --profile minimal --component clippy
          rustup default "$rust"
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p spare-dongle --all-targets -- -D warnings
      - run: cargo test -p spare-dongle
