[package]
name = "diagjni"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "sparedongle"
crate-type = ["cdylib", "rlib"]

[dependencies]
diagclient = { path = "../../client" }
diagwire = { path = "../../wire", features = ["serde"] }
anyhow = "1"
jni = "0.21"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
diagclient = { path = "../../client", features = ["testing"] }
